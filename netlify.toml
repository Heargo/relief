# User docs (docs/user, Astro Starlight) served at the root of the Netlify site.
# The app embeds the same docs under /docs: DOCS_BASE only changes the Netlify build.
[build]
  base = "docs/user"
  command = "npm run build"
  publish = "dist"

[build.environment]
  DOCS_BASE = "/"
  # Astro needs Node >= 22.23.4
  NODE_VERSION = "24"
