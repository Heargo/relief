[package]
name = "relief-index"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
relief-adapter-api = { path = "../relief-adapter-api" }
relief-git = { path = "../relief-git" }
relief-model = { path = "../../domain/relief-model" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
relief-fixtures = { path = "../../../tests/relief-fixtures" }
serde_json = "1"
tempfile = "3"
