[package]
name = "relief-rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
globset = "0.4"
relief-model = { path = "../relief-model" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
thiserror = "2"

[dev-dependencies]
relief-model = { path = "../relief-model", features = ["testing"] }
relief-diff = { path = "../relief-diff" }
relief-fixtures = { path = "../../../tests/relief-fixtures" }
relief-detect = { path = "../../analysis/relief-detect" }
relief-git = { path = "../../analysis/relief-git" }
relief-index = { path = "../../analysis/relief-index" }
relief-lang-ts = { path = "../../analysis/lang/relief-lang-ts" }
tempfile = "3"
