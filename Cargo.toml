[workspace]
resolver = "3"
members = ["src/domain/*", "src/analysis/relief-*", "src/analysis/lang/*", "src/app/*", "src/interfaces/*", "tests/relief-bench", "tests/relief-fixtures", "tests/relief-integration"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
err_expect = "allow"
